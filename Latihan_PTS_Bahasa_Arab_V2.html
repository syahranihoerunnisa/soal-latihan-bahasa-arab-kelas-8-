<!DOCTYPE html><html lang='id'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Latihan PTS Bahasa Arab VIII</title><link href='https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap' rel='stylesheet'><style>body{font-family:Poppins,sans-serif;background:linear-gradient(135deg,#0ea5e9,#10b981);margin:0;padding:20px}.box{max-width:820px;margin:auto}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 20px rgba(0,0,0,.15)}.top{display:flex;justify-content:space-between;color:#fff;font-weight:600;margin-bottom:10px}.progress{height:10px;background:#ffffff55;border-radius:20px;margin-bottom:16px}#bar{height:100%;width:0;background:#fff;border-radius:20px}.opt{border:2px solid #ddd;padding:14px;border-radius:10px;margin:10px 0;cursor:pointer}.opt.sel{background:#dcfce7;border-color:#10b981}button{width:100%;padding:14px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-size:16px}.hidden{display:none}.score{font-size:56px;color:#2563eb;text-align:center;font-weight:700}</style></head><body><div class='box'><div class='card' style='text-align:center;margin-bottom:18px'><h1>📚 Latihan PTS Bahasa Arab</h1><p>Kelas VIII • 35 Soal</p></div><div class='top'><span id='timer'>60:00</span><span id='count'>1/35</span></div><div class='progress'><div id='bar'></div></div><div class='card' id='quiz'><div id='num'></div><h2 id='q'></h2><div id='ops'></div><button id='next'>Selanjutnya ➜</button></div><div class='card hidden' id='res'><h2 style='text-align:center'>🎉 Latihan Selesai</h2><div class='score' id='nilai'></div><p style='text-align:center'>Benar <span id='benar'></span> dari 35 soal.</p><button onclick='location.reload()'>Ulangi</button></div></div><script>const questions=[{q:'Arti kata **الْمَكْتَبَةُ** adalah...',o:['Perpustakaan','Sekolah','Masjid','Rumah'],a:0},{q:'Kata **الْمَدْرَسَةُ** termasuk...',o:["Fi'il",'Huruf','Isim','Bilangan'],a:2},{q:"Yang termasuk fi'il adalah...",o:['قَلَمٌ','يَكْتُبُ','بَيْتٌ','مَدْرَسَةٌ'],a:1},{q:'Yang termasuk huruf adalah...',o:['عَلَى','جَلَسَ','مُعَلِّمٌ','طَبِيبٌ'],a:0},{q:'Arti **كُرَةُ الْقَدَمِ** adalah...',o:['Bola Basket','Bola Voli','Sepak Bola','Bulu Tangkis'],a:2},{q:'Arti **كُرَةُ السَّلَّةِ** adalah...',o:['Sepak Bola','Bola Basket','Bola Voli','Bulu Tangkis'],a:1},{q:'Arti **كُرَةُ الطَّائِرَةِ** adalah...',o:['Bola Voli','Sepak Bola','Bola Basket','Tenis'],a:0},{q:"Bahasa Arab dari 'pagi hari' adalah...",o:['ليلاً','مساءً','نهارًا','صباحًا'],a:3},{q:"Bahasa Arab dari 'malam hari' adalah...",o:['نهارًا','صباحًا','ليلاً','مساءً'],a:2},{q:'Arti **السَّفَرُ** adalah...',o:['Memasak','Menggambar','Bepergian','Membaca'],a:2},{q:'Kata **الْحَدِيقَةُ** berarti...',o:['Taman','Pantai','Pasar','Kelas'],a:0},{q:'Kata **الطَّالِبُ** berarti...',o:['Guru','Siswa','Dokter','Ayah'],a:1},{q:'Kata **أُمٌّ** berarti...',o:['Ayah','Ibu','Kakak','Teman'],a:1},{q:'Kata **أَبِي** berarti...',o:['Ayahku','Ibuku','Kakakku','Adikku'],a:0},{q:'Dalam kalimat **الطَّالِبُ فِي الْفَصْلِ**, kata **فِي** termasuk...',o:['Isim',"Fi'il",'Huruf','Dhamir'],a:2},{q:"Yang termasuk fi'il adalah...",o:['يَلْعَبُ','بَيْتٌ','طَالِبٌ','مَدْرَسَةٌ'],a:0},{q:'Yang termasuk huruf adalah...',o:['مِنْ','قَلَمٌ','يَذْهَبُ','بَيْتٌ'],a:0},{q:'Arti **يَذْهَبُ** adalah...',o:['Duduk','Menulis','Pergi','Membaca'],a:2},{q:'Arti **قَرَأَ** adalah...',o:['Bermain','Membaca','Memasak','Tidur'],a:1},{q:'Arti **كَتَبَ** adalah...',o:['Menulis','Pergi','Menggambar','Memotret'],a:0},{q:'**السَّاعَةُ السَّابِعَةُ وَالرُّبْعُ** berarti...',o:['07.15','07.30','07.45','08.15'],a:0},{q:'Pukul **06.30** dalam bahasa Arab adalah...',o:['السادسة والربع','السادسة والنصف','السابعة إلا ربعًا','السابعة'],a:1},{q:'Pukul **04.45** adalah...',o:['الرابعة والنصف','الرابعة والربع','الخامسة إلا ربعًا','الخامسة'],a:2},{q:'**السَّاعَةُ التَّاسِعَةُ وَالنِّصْفُ** berarti...',o:['09.15','09.30','09.45','10.00'],a:1},{q:'Pukul **11.45** dalam bahasa Arab adalah...',o:['الحادية عشرة والربع','الثانية عشرة إلا ربعًا','الحادية عشرة والنصف','الثانية عشرة'],a:1},{q:'Pukul **08.00 malam** dalam bahasa Arab adalah...',o:['السَّاعَةُ الثَّامِنَةُ مَسَاءً','السَّاعَةُ الثَّامِنَةُ صَبَاحًا','السَّاعَةُ التَّاسِعَةُ مَسَاءً','السَّاعَةُ السَّابِعَةُ مَسَاءً'],a:0},{q:'Pilih harakat yang benar!',o:['هُوَ طَبِيبٌ','هُوَ طَبِيبَ','هُوَ طَبِيبِ','هُوُ طَبِيبٌ'],a:0},{q:'Kata **الْمَسْجِدُ** termasuk...',o:['Huruf',"Fi'il",'Isim','Bilangan'],a:2},{q:'Arti **الْقِرَاءَةُ** adalah...',o:['Membaca','Menulis','Memasak','Bepergian'],a:0},{q:'Arti **الرَّسْمُ** adalah...',o:['Menggambar','Berenang','Memotret','Memasak'],a:0},{q:'Arti **الطَّبْخُ** adalah...',o:['Memotret','Memasak','Menggambar','Membaca'],a:1},{q:'Arti **التَّصْوِيرُ** adalah...',o:['Menggambar','Memotret','Bepergian','Membaca'],a:1},{q:'Kata **الْكِتَابُ** termasuk...',o:['Huruf','Isim',"Fi'il",'Bilangan'],a:1},{q:'Kata **الْقَلَمُ** termasuk...',o:['Isim','Huruf',"Fi'il",'Dhamir'],a:0},{q:'Yang termasuk isim adalah...',o:['يَجْلِسُ','فِي','مُعَلِّمٌ','مِنْ'],a:2}];let i=0,s=0,a=[];const q=document.getElementById('q'),ops=document.getElementById('ops');function load(){document.getElementById('num').textContent='Soal '+(i+1);document.getElementById('count').textContent=(i+1)+'/35';document.getElementById('bar').style.width=((i+1)/35*100)+'%';q.innerHTML=questions[i].q;ops.innerHTML='';questions[i].o.forEach((t,n)=>{let d=document.createElement('div');d.className='opt';d.innerHTML=t;d.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');a[i]=n};ops.appendChild(d)})}load();document.getElementById('next').onclick=()=>{if(a[i]==null){alert('Pilih jawaban dulu ya 😊');return}if(a[i]==questions[i].a)s++;i++;if(i<35)load();else{document.getElementById('quiz').classList.add('hidden');document.getElementById('res').classList.remove('hidden');document.getElementById('nilai').textContent=Math.round(s/35*100);document.getElementById('benar').textContent=s;}};let t=3600;setInterval(()=>{let m=Math.floor(t/60),ss=t%60;document.getElementById('timer').textContent=m+':'+String(ss).padStart(2,'0');t--;},1000);</script></body></html>
